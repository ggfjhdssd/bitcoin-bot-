<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        .btn { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        .btn:disabled { background: #cccccc; }
        #status-text { margin-top: 20px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <h2>💸 ကြော်ငြာကြည့်ပြီး ပိုက်ဆံရှာပါ 💸</h2>
    
    <button id="ad-button" class="btn" onclick="handleShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
    
    <div id="status-text"></div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();

        // AdsGram Initialize (သင့် Block ID)
        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        async function handleShowAd() {
            const btn = document.getElementById('ad-button');
            const status = document.getElementById('status-text');

            // ၁။ စာသားပြောင်းပြီး ခလုတ်ပိတ်မည်
            btn.disabled = true;
            status.innerText = "ခတ္တခနစောင့်ပါ... ကြော်ငြာရှာပေးနေပါသည်။ 🔎";

            try {
                // ၂။ ကြော်ငြာပြမည်
                const result = await AdController.show();

                if (result.done) {
                    status.innerText = "✅ ကြော်ငြာကြည့်ရှုမှု အောင်မြင်သည်။ ပိုက်ဆံပေါင်းထည့်နေသည်...";
                    // ၃။ Backend သို့ Reward ပို့မည်
                    await fetch('/reward-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: WebApp.initDataUnsafe.user.id })
                    });
                    status.innerText = "💰 ၅၀၀ ကျပ် ပေါင်းထည့်ပြီးပါပြီ။";
                } else {
                    status.innerText = "⚠️ ကြော်ငြာကို အဆုံးထိကြည့်မှ ငွေရပါမည်။";
                }
            } catch (error) {
                status.innerText = "❌ ယခုအချိန်တွင် ကြော်ငြာမရှိသေးပါ။ နောက်မှ ပြန်ကြိုးစားပါ။";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
