<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; text-align: center; padding: 20px; background: #ffffff; color: #333; }
        .container { border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fdfdfd; border: 1px solid #eee; }
        h2 { color: #0088cc; font-size: 22px; margin-bottom: 10px; }
        .vpn-warning { color: #ff0000; font-weight: bold; font-size: 13px; margin-bottom: 15px; border: 1px dashed #ff0000; padding: 8px; border-radius: 10px; background: #fff5f5; }
        #balance-display { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #0b5e2e; background: #fff9c4; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #fbc02d; }
        .btn { color: white; border: none; padding: 15px 20px; border-radius: 15px; font-size: 17px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        #ad-button { background: #0088cc; }
        #withdraw-button { background: #28a745; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cccccc !important; cursor: not-allowed; }
        #status-text { margin-top: 20px; font-size: 14px; color: #666; min-height: 40px; }
        #timer-text { font-size: 14px; color: #ff5722; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💰 ကြော်ငြာကြည့်ပြီး ငွေစုပါ 💰</h2>
        
        <div id="balance-display">
            <span>💰</span>
            <span id="balance-value">0</span>
            <span>MMK</span>
        </div>

        <div class="vpn-warning">
            ⚠️ VPN (USA/UK) ဖွင့်ထားမှ ကြော်ငြာပေါ်ပါမည်။
        </div>

        <button id="ad-button" class="btn" onclick="confirmShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
        <div id="timer-text"></div>

        <button id="withdraw-button" class="btn" onclick="handleWithdraw()">💸 ငွေထုတ်မည်</button>
        
        <div id="status-text">ကြော်ငြာတစ်ခုကြည့်လျှင် ၂,၀၀၀ MMK ရပါမည်</div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        let localBalance = parseInt(localStorage.getItem('my_coin_balance')) || 0;
        const REWARD_AMOUNT = 2000;
        const MIN_WITHDRAW = 100000;
        const TIMER_KEY = 'ad_cooldown_expiry';

        // For timer interval
        let timerInterval = null;

        function displayBalance() {
            document.getElementById('balance-value').innerText = localBalance.toLocaleString();
        }

        displayBalance();
        checkExistingTimer();

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function checkExistingTimer() {
            const expiry = localStorage.getItem(TIMER_KEY);
            if (expiry) {
                const remaining = Math.floor((parseInt(expiry) - Date.now()) / 1000);
                if (remaining > 0) {
                    startTimer(remaining);
                } else {
                    localStorage.removeItem(TIMER_KEY);
                }
            }
        }

        function startTimer(duration) {
            const btn = document.getElementById('ad-button');
            const timerDisplay = document.getElementById('timer-text');
            
            // Stop any existing timer
            stopTimer();
            
            btn.disabled = true;
            let timer = duration;

            timerInterval = setInterval(() => {
                if (timer <= 0) {
                    // Timer finished
                    stopTimer();
                    timerDisplay.innerText = "";
                    btn.disabled = false;
                    localStorage.removeItem(TIMER_KEY);
                    return;
                }
                
                timerDisplay.innerText = `နောက်ထပ်ကြည့်ရန် ${timer} စက္ကန့် စောင့်ပါ`;
                timer--;
            }, 1000);
        }

        function confirmShowAd() {
            // Check if timer is active (button disabled)
            if (document.getElementById('ad-button').disabled) {
                WebApp.showAlert("ကျေးဇူးပြု၍ timer ပြီးသည်အထိ စောင့်ပါ။");
                return;
            }

            WebApp.showPopup({
                title: 'ကြော်ငြာကြည့်မည်',
                message: '၂,၀၀၀ MMK ရရှိရန် ကြော်ငြာကို အဆုံးထိ (၁၄ စက္ကန့်ကျော်) ကြည့်ပေးပါ။',
                buttons: [
                    { id: 'cancel', type: 'cancel', text: 'မကြည့်သေးပါ' },
                    { id: 'ok', type: 'default', text: 'ကြည့်မည်' }
                ]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    handleShowAd();
                }
            });
        }

        async function handleShowAd() {
            const status = document.getElementById('status-text');
            const btn = document.getElementById('ad-button');
            
            status.innerHTML = "<b>ကြော်ငြာရှာနေသည်... 🔎</b>";
            btn.disabled = true;

            try {
                const startTime = Date.now();
                const result = await AdController.show();
                const endTime = Date.now();
                const watchedSeconds = Math.floor((endTime - startTime) / 1000);

                // ၁၄ စက္ကန့်ပြည့်အောင်ကြည့်မှ ပိုက်ဆံပေးမည်
                if (result && result.done && watchedSeconds >= 14) {
                    localBalance += REWARD_AMOUNT;
                    localStorage.setItem('my_coin_balance', localBalance);
                    displayBalance();
                    
                    status.innerHTML = "<b style='color:green;'>✅ အောင်မြင်သည်။ ၂,၀၀၀ MMK ရရှိပါပြီ။</b>";
                    
                    const cooldownSeconds = 300; // ၅ မိနစ် (၃၀၀ စက္ကန့်)
                    localStorage.setItem(TIMER_KEY, Date.now() + (cooldownSeconds * 1000));
                    startTimer(cooldownSeconds);

                    WebApp.showAlert("ဂုဏ်ယူပါတယ်! ၂,၀၀၀ MMK ရရှိပါပြီ။");
                } else {
                    btn.disabled = false;
                    status.innerHTML = "<b style='color:orange;'>⚠️ ကြော်ငြာကို အဆုံးထိမကြည့်ရသေးပါ။ (အနည်းဆုံး ၁၄ စက္ကန့် ကြည့်ပေးပါ)</b>";
                    WebApp.showAlert("ကြော်ငြာကို အဆုံးထိကြည့်မှ ပိုက်ဆံရပါမည်။");
                }
            } catch (error) {
                btn.disabled = false;
                status.innerHTML = "<b style='color:red;'>❌ ကြော်ငြာမရှိပါ။ VPN ပြောင်းကြည့်ပါ။</b>";
            }
        }

        function handleWithdraw() {
            if (localBalance < MIN_WITHDRAW) {
                WebApp.showAlert(`❌ အနည်းဆုံး ${MIN_WITHDRAW.toLocaleString()} MMK ပြည့်မှ ထုတ်လို့ရပါမည်။`);
            } else {
                WebApp.showPopup({
                    title: 'ငွေထုတ်ယူခြင်း',
                    message: `${localBalance.toLocaleString()} MMK ထုတ်ယူရန် သေချာပါသလား?`,
                    buttons: [
                        { id: 'no', type: 'cancel', text: 'မထုတ်သေးပါ' },
                        { id: 'yes', type: 'default', text: 'ထုတ်မည်' }
                    ]
                }, (buttonId) => {
                    if (buttonId === 'yes') {
                        WebApp.sendData(`${localBalance.toLocaleString()} MMK ထုတ်မည်`);
                        WebApp.close();
                    }
                });
            }
        }
    </script>
</body>
</html>
