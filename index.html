<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; text-align: center; padding: 30px; background: #ffffff; color: #333; }
        .container { border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fdfdfd; border: 1px solid #eee; }
        h2 { color: #0088cc; font-size: 22px; margin-bottom: 10px; }
        .vpn-warning { color: #ff0000; font-weight: bold; font-size: 14px; margin-bottom: 15px; border: 1px dashed #ff0000; padding: 10px; border-radius: 10px; background: #fff5f5; }
        .btn { background: #0088cc; color: white; border: none; padding: 18px 30px; border-radius: 15px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cccccc; }
        #status-text { margin-top: 25px; font-size: 15px; color: #666; line-height: 1.6; min-height: 50px; }
        #balance-display { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #0b5e2e; background: #e8f5e9; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .coin-icon { width: 30px; height: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💸 ကြော်ငြာကြည့်ပြီး ငွေရှာပါ 💸</h2>
        
        <div id="balance-display">
            <img src="https://cdn-icons-png.flaticon.com/512/217/217853.png" class="coin-icon" alt="coin">
            <span id="balance-value">ရယူနေသည်...</span>
        </div>

        <div class="vpn-warning">
            ⚠️ အထူးသတိပေးချက် ⚠️<br>
            ကြော်ငြာကြည့်ရန် VPN (USA/UK/Japan) တစ်ခုခုကို မဖြစ်မနေ ဖွင့်ထားပေးပါ။ VPN မဖွင့်ထားပါက ကြော်ငြာပေါ်မည်မဟုတ်သလို ငွေလည်းရရှိမည်မဟုတ်ပါ။
        </div>

        <button id="ad-button" class="btn" onclick="confirmShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
        
        <div id="status-text">ကြော်ငြာကြည့်ပြီး ၅၀၀ ကျပ် ရယူပါ</div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        // Adsgram Block ID 
        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        // User ID
        const userId = WebApp.initDataUnsafe?.user?.id ? String(WebApp.initDataUnsafe.user.id) : null;
        
        if (!userId) {
            document.getElementById('status-text').innerHTML = "<b style='color:red;'>❌ Error: Bot ထဲမှ ပြန်ဝင်ပေးပါ။</b>";
            document.getElementById('balance-value').innerText = "မရပါ";
        }

        // လက်ကျန်ငွေပြရန်
        async function updateBalance() {
            if (!userId) return;
            try {
                const res = await fetch('https://bitcoin-bot-2zmf.onrender.com/get-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                });
                const data = await res.json();
                if (data && data.balance !== undefined) {
                    document.getElementById('balance-value').innerText = data.balance.toLocaleString() + ' ကျပ်';
                }
            } catch (e) {
                console.error('Balance fetch error:', e);
                document.getElementById('balance-value').innerText = "ချိတ်ဆက်မှုမရှိပါ";
            }
        }

        updateBalance();

        function confirmShowAd() {
            if (!userId) {
                WebApp.showAlert("User ID မတွေ့ပါ။ Bot ထဲမှ ပြန်ဝင်ပေးပါ။");
                return;
            }
            WebApp.showPopup({
                title: 'VPN စစ်ဆေးပြီးပြီလား?',
                message: 'ကြော်ငြာကြည့်ရန် VPN (USA/UK) ဖွင့်ထားရပါမည်။ မဖွင့်ရသေးပါက ပိတ်ပြီး VPN အရင်ဖွင့်ပါ။ ဖွင့်ပြီးပါက "ကြည့်မည်" ကိုနှိပ်ပါ။',
                buttons: [
                    { id: 'cancel', type: 'cancel', text: 'မကြည့်သေးပါ' },
                    { id: 'ok', type: 'default', text: 'ကြည့်မည်' }
                ]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    handleShowAd();
                }
            });
        }

        async function handleShowAd() {
            const btn = document.getElementById('ad-button');
            const status = document.getElementById('status-text');

            btn.disabled = true;
            status.innerHTML = "<b>ကြော်ငြာရှာနေသည်... (VPN မဖွင့်ထားလျှင် ကြာနိုင်ပါသည်) 🔎</b>";

            try {
                const result = await AdController.show();

                if (result && result.done) {
                    status.innerHTML = "<b>✅ အောင်မြင်သည်။ ငွေစာရင်းထဲ ပေါင်းထည့်နေသည်... ⏳</b>";
                    
                    try {
                        const response = await fetch('https://bitcoin-bot-2zmf.onrender.com/reward-user', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.success) {
                                status.innerHTML = "<b style='color:green;'>💰 ၅၀၀ ကျပ် ပေါင်းထည့်ပြီးပါပြီ။ ✨</b>";
                                updateBalance(); // ပိုက်ဆံပေါင်းပြီးတာနဲ့ balance ကို ချက်ချင်း update လုပ်မယ်
                                WebApp.showAlert("ဂုဏ်ယူပါတယ်! ၅၀၀ ကျပ် ရရှိပါပြီ။");
                            }
                        } else {
                            status.innerHTML = "<b style='color:red;'>❌ ငွေပေါင်းရာတွင် အဆင်မပြေပါ။ ခေတ္တစောင့်ပါ။</b>";
                        }
                    } catch (err) {
                        console.error('Reward error:', err);
                        status.innerHTML = "<b style='color:red;'>❌ Server Error: ငွေမပေါင်းနိုင်ပါ။</b>";
                    }
                } else {
                    status.innerHTML = "<b style='color:orange;'>⚠️ ကြော်ငြာကို အဆုံးထိကြည့်မှ ငွေရပါမည်။</b>";
                }
            } catch (error) {
                console.error(error);
                status.innerHTML = "<b style='color:red;'>❌ ကြော်ငြာမရှိပါ။ VPN (USA) ပြောင်းချိတ်ပြီး ၉ စက္ကန့်ခန့်စောင့်ပြီး ပြန်နှိပ်ပါ။</b>";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
