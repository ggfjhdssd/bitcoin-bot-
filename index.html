<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; text-align: center; padding: 30px; background: #ffffff; color: #333; }
        .container { border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fdfdfd; }
        h2 { color: #0088cc; font-size: 22px; }
        .btn { background: #0088cc; color: white; border: none; padding: 18px 30px; border-radius: 15px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cccccc; }
        #status-text { margin-top: 25px; font-size: 15px; color: #666; line-height: 1.6; }
        #balance-display { font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #0b5e2e; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💸 ကြော်ငြာကြည့်ပြီး ပိုက်ဆံရှာပါ 💸</h2>
        <p>ကြော်ငြာတစ်ခုကြည့်လျှင် ၅၀၀ ကျပ် ရရှိမည်။</p>
        
        <div id="balance-display">လက်ကျန်ငွေ: <span id="balance-value">ဖွင့်နေသည်...</span></div>

        <button id="ad-button" class="btn" onclick="confirmShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
        
        <div id="status-text">ကြော်ငြာကြည့်ရန် အပေါ်ကခလုတ်ကို နှိပ်ပါ</div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        // Adsgram Block ID 
        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        // User ID ရယူခြင်း (String အဖြစ်ပြောင်းထားပါက ပိုစိတ်ချရသည်)
        const userId = WebApp.initDataUnsafe?.user?.id ? String(WebApp.initDataUnsafe.user.id) : null;
        
        if (!userId) {
            document.getElementById('status-text').innerText = "❌ Telegram user ID မရပါ။ Bot မှပြန်ဖွင့်ပါ။";
            document.getElementById('balance-value').innerText = "မရပါ";
        }

        // လက်ကျန်ငွေပြရန် (URL အပြည့်အစုံဖြင့် ပြောင်းလဲထားသည်)
        async function updateBalance() {
            if (!userId) return;
            try {
                const res = await fetch('https://bitcoin-bot-2zmf.onrender.com/get-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                });
                const data = await res.json();
                if (data && data.balance !== undefined) {
                    document.getElementById('balance-value').innerText = data.balance.toLocaleString() + ' ကျပ်';
                }
            } catch (e) {
                console.error('Balance fetch error:', e);
            }
        }

        updateBalance();

        function confirmShowAd() {
            if (!userId) {
                WebApp.showAlert("User ID မတွေ့ပါ။ Bot ထဲမှ ပြန်ဝင်ပေးပါ။");
                return;
            }
            WebApp.showPopup({
                title: 'အတည်ပြုချက်',
                message: 'ကြော်ငြာကြည့်ရှုမည် သေချာပါသလား?',
                buttons: [
                    { id: 'cancel', type: 'cancel', text: 'မကြည့်ပါ' },
                    { id: 'ok', type: 'default', text: 'ကြည့်မည်' }
                ]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    handleShowAd();
                }
            });
        }

        async function handleShowAd() {
            const btn = document.getElementById('ad-button');
            const status = document.getElementById('status-text');

            btn.disabled = true;
            status.innerText = "ခတ္တခနစောင့်ပါ... ကြော်ငြာရှာပေးနေပါသည်။ 🔎";

            try {
                const result = await AdController.show();

                if (result && result.done) {
                    status.innerHTML = "<b>✅ ကြော်ငြာကြည့်ရှုမှု အောင်မြင်သည်။</b><br>ပိုက်ဆံပေါင်းထည့်နေသည်... ⏳";
                    
                    let success = false;
                    try {
                        // Reward တောင်းဆိုရာတွင် URL အပြည့်အစုံ အသုံးပြုထားသည်
                        const response = await fetch('https://bitcoin-bot-2zmf.onrender.com/reward-user', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: userId })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.success) {
                                success = true;
                                status.innerHTML = "<b style='color:green;'>💰 ၅၀၀ ကျပ် ပေါင်းထည့်ပြီးပါပြီ။</b>";
                                updateBalance();
                                WebApp.showAlert("၅၀၀ ကျပ် ရရှိပါပြီ။");
                            }
                        }
                    } catch (err) {
                        console.error('Reward error:', err);
                    }

                    if (!success) {
                        status.innerText = "❌ ငွေပေါင်းရာတွင် အဆင်မပြေပါ။ Bot တွင် လက်ကျန်ငွေ ပြန်စစ်ပါ။";
                    }
                } else {
                    status.innerText = "⚠️ ကြော်ငြာကို အဆုံးထိကြည့်မှ ငွေရပါမည်။";
                }
            } catch (error) {
                console.error(error);
                status.innerHTML = "❌ <b style='color:red;'>ကြော်ငြာမရှိသေးပါ သို့မဟုတ် Error ဖြစ်နေသည်။</b><br>ခဏကြာမှ ပြန်စမ်းပါ။";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
