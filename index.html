<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; text-align: center; padding: 30px; background: #ffffff; color: #333; }
        .container { border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fdfdfd; border: 1px solid #eee; }
        h2 { color: #0088cc; font-size: 22px; margin-bottom: 10px; }
        .vpn-warning { color: #ff0000; font-weight: bold; font-size: 14px; margin-bottom: 15px; border: 1px dashed #ff0000; padding: 10px; border-radius: 10px; background: #fff5f5; }
        .btn { background: #0088cc; color: white; border: none; padding: 18px 30px; border-radius: 15px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cccccc; }
        #status-text { margin-top: 25px; font-size: 15px; color: #666; line-height: 1.6; min-height: 50px; }
        #balance-display { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #0b5e2e; background: #fff9c4; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #fbc02d; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💰 ကြော်ငြာကြည့်ပြီး စုဆောင်းပါ 💰</h2>
        
        <div id="balance-display">
            <span>💰</span>
            <span id="balance-value">0</span>
            <span>MMK</span>
        </div>

        <div class="vpn-warning">
            ⚠️ အထူးသတိပေးချက် ⚠️<br>
            ကြော်ငြာကြည့်ရန် VPN (USA/UK/Japan) တစ်ခုခုကို ဖွင့်ထားပေးပါ။
        </div>

        <button id="ad-button" class="btn" onclick="confirmShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
        
        <div id="status-text">ကြော်ငြာတစ်ခုကြည့်လျှင် ၅၀၀ MMK ရပါမည်</div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        // Adsgram Block ID 
        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        // Local Storage ကနေ သိမ်းထားတဲ့ balance ကို ပြန်ယူမယ်
        let localBalance = parseInt(localStorage.getItem('my_coin_balance')) || 0;

        // Balance ကို စခရင်ပေါ်မှာ ပြပေးတဲ့ function
        function displayBalance() {
            document.getElementById('balance-value').innerText = localBalance.toLocaleString();
        }

        // စစဖွင့်ချင်း balance ပြမယ်
        displayBalance();

        function confirmShowAd() {
            WebApp.showPopup({
                title: 'ကြော်ငြာကြည့်မည်',
                message: 'ကြော်ငြာကြည့်ပြီး ၅၀၀ MMK စုဆောင်းမှာ သေချာပါသလား? (VPN ဖွင့်ထားရန် လိုအပ်ပါသည်)',
                buttons: [
                    { id: 'cancel', type: 'cancel', text: 'မကြည့်သေးပါ' },
                    { id: 'ok', type: 'default', text: 'ကြည့်မည်' }
                ]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    handleShowAd();
                }
            });
        }

        async function handleShowAd() {
            const btn = document.getElementById('ad-button');
            const status = document.getElementById('status-text');

            btn.disabled = true;
            status.innerHTML = "<b>ကြော်ငြာရှာနေသည်... 🔎</b>";

            try {
                const result = await AdController.show();

                if (result && result.done) {
                    // ကြော်ငြာကြည့်ပြီးရင် ၅၀၀ တိုးမယ်
                    localBalance += 500;
                    
                    // Local Storage ထဲမှာ အမြဲတမ်းသိမ်းထားမယ် (ဖုန်းပိတ်လိုက်လည်း မပျောက်အောင်)
                    localStorage.setItem('my_coin_balance', localBalance);
                    
                    displayBalance();
                    status.innerHTML = "<b style='color:green;'>💰 ၅၀၀ MMK ထပ်တိုးသွားပါပြီ။ ✨</b>";
                    WebApp.showAlert("ဂုဏ်ယူပါတယ်! ၅၀၀ MMK ရရှိပါပြီ။");
                } else {
                    status.innerHTML = "<b style='color:orange;'>⚠️ ကြော်ငြာကို အဆုံးထိကြည့်မှ ရပါမည်။</b>";
                }
            } catch (error) {
                console.error(error);
                status.innerHTML = "<b style='color:red;'>❌ ကြော်ငြာမရှိပါ။ VPN ပြောင်းချိတ်ပြီး ပြန်ကြိုးစားပါ။</b>";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
