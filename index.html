<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; text-align: center; padding: 30px; background: #ffffff; color: #333; }
        .container { border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fdfdfd; }
        h2 { color: #0088cc; font-size: 22px; }
        .btn { background: #0088cc; color: white; border: none; padding: 18px 30px; border-radius: 15px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cccccc; }
        #status-text { margin-top: 25px; font-size: 15px; color: #666; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💸 ကြော်ငြာကြည့်ပြီး ပိုက်ဆံရှာပါ 💸</h2>
        <p>ကြော်ငြာတစ်ခုကြည့်လျှင် ၅၀၀ ကျပ် ရရှိမည်။</p>
        
        <button id="ad-button" class="btn" onclick="handleShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
        
        <div id="status-text">ကြော်ငြာကြည့်ရန် အပေါ်ကခလုတ်ကို နှိပ်ပါ</div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        // Adsgram Block ID (သင်၏ ID ကို ဤနေရာတွင် စစ်ဆေးပါ)
        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        async function handleShowAd() {
            const btn = document.getElementById('ad-button');
            const status = document.getElementById('status-text');

            btn.disabled = true;
            status.innerText = "ခတ္တခနစောင့်ပါ... ကြော်ငြာရှာပေးနေပါသည်။ 🔎";

            try {
                // ကြော်ငြာပြသခြင်း
                const result = await AdController.show();

                if (result.done) {
                    status.innerHTML = "<b>✅ ကြော်ငြာကြည့်ရှုမှု အောင်မြင်သည်။</b><br>ပိုက်ဆံပေါင်းထည့်နေသည်... ⏳";
                    
                    // Bot Backend သို့ Reward တောင်းဆိုခြင်း
                    const response = await fetch('/reward-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: WebApp.initDataUnsafe.user.id })
                    });

                    const data = await response.json();
                    if(data.success) {
                        status.innerHTML = "<b style='color:green;'>💰 ၅၀၀ ကျပ် ပေါင်းထည့်ပြီးပါပြီ။</b><br>Bot မှ Message ပို့ပေးပါလိမ့်မည်။";
                    } else {
                        status.innerText = "❌ ပိုက်ဆံပေါင်းထည့်ရာတွင် အမှားအယွင်းရှိပါသည်။";
                    }
                } else {
                    status.innerText = "⚠️ ကြော်ငြာကို အဆုံးထိကြည့်မှ ငွေရပါမည်။";
                }
            } catch (error) {
                // ကြော်ငြာမရှိခြင်း (သို့မဟုတ်) အခြား Error များ
                console.error(error);
                status.innerHTML = "❌ <b style='color:red;'>ယခုအချိန်တွင် ကြော်ငြာမရှိသေးပါ။</b><br>ခဏကြာမှ ပြန်ကြိုးစားပေးပါ။";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
