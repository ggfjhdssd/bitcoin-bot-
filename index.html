<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; text-align: center; padding: 20px; background: #ffffff; color: #333; }
        .container { border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fdfdfd; border: 1px solid #eee; }
        h2 { color: #0088cc; font-size: 22px; margin-bottom: 10px; }
        .vpn-warning { color: #ff0000; font-weight: bold; font-size: 13px; margin-bottom: 15px; border: 1px dashed #ff0000; padding: 8px; border-radius: 10px; background: #fff5f5; }
        
        /* Balance Display */
        #balance-display { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #0b5e2e; background: #fff9c4; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #fbc02d; }
        
        /* Buttons */
        .btn { color: white; border: none; padding: 15px 20px; border-radius: 15px; font-size: 17px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        #ad-button { background: #0088cc; }
        #withdraw-button { background: #28a745; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #cccccc !important; cursor: not-allowed; }
        
        #status-text { margin-top: 20px; font-size: 14px; color: #666; min-height: 40px; }
        #timer-text { font-size: 14px; color: #ff5722; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>💰 ကြော်ငြာကြည့်ပြီး ငွေစုပါ 💰</h2>
        
        <div id="balance-display">
            <span>💰</span>
            <span id="balance-value">0</span>
            <span>MMK</span>
        </div>

        <div class="vpn-warning">
            ⚠️ VPN (USA/UK) ဖွင့်ထားမှ ကြော်ငြာပေါ်ပါမည်။
        </div>

        <button id="ad-button" class="btn" onclick="confirmShowAd()">📺 ကြော်ငြာကြည့်မည်</button>
        <div id="timer-text"></div>

        <button id="withdraw-button" class="btn" onclick="handleWithdraw()">💸 ငွေထုတ်မည်</button>
        
        <div id="status-text">ကြော်ငြာကြည့်ပြီး ၅၀၀ MMK စုဆောင်းပါ</div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        // Local Storage ကနေ Balance ယူမယ်
        let localBalance = parseInt(localStorage.getItem('my_coin_balance')) || 0;
        const MIN_WITHDRAW = 100000; // အနည်းဆုံး ၁ သိန်း

        function displayBalance() {
            document.getElementById('balance-value').innerText = localBalance.toLocaleString();
        }

        displayBalance();

        // Timer စနစ် (၁ မိနစ်)
        function startTimer(duration) {
            const btn = document.getElementById('ad-button');
            const timerDisplay = document.getElementById('timer-text');
            let timer = duration;

            btn.disabled = true;
            
            const countdown = setInterval(() => {
                let seconds = parseInt(timer % 60, 10);
                timerDisplay.innerText = `နောက်ထပ်ကြည့်ရန် ${seconds} စက္ကန့် စောင့်ပေးပါ`;

                if (--timer < 0) {
                    clearInterval(countdown);
                    timerDisplay.innerText = "";
                    btn.disabled = false;
                }
            }, 1000);
        }

        function confirmShowAd() {
            WebApp.showPopup({
                title: 'ကြော်ငြာကြည့်မည်',
                message: '၅၀၀ MMK ရရှိရန် ကြော်ငြာကို အဆုံးထိကြည့်ပါ။',
                buttons: [
                    { id: 'cancel', type: 'cancel', text: 'မကြည့်သေးပါ' },
                    { id: 'ok', type: 'default', text: 'ကြည့်မည်' }
                ]
            }, (buttonId) => {
                if (buttonId === 'ok') {
                    handleShowAd();
                }
            });
        }

        async function handleShowAd() {
            const status = document.getElementById('status-text');
            try {
                const result = await AdController.show();
                if (result && result.done) {
                    localBalance += 500;
                    localStorage.setItem('my_coin_balance', localBalance);
                    displayBalance();
                    status.innerHTML = "<b style='color:green;'>✅ ၅၀၀ MMK ထပ်တိုးသွားပါပြီ။</b>";
                    startTimer(60); // ၁ မိနစ် Timer စတင်မယ်
                }
            } catch (error) {
                status.innerHTML = "<b style='color:red;'>❌ ကြော်ငြာမရှိပါ။ VPN ပြောင်းကြည့်ပါ။</b>";
            }
        }

        // ငွေထုတ်သည့်စနစ်
        function handleWithdraw() {
            if (localBalance < MIN_WITHDRAW) {
                WebApp.showAlert(`❌ ငွေထုတ်ရန် မလုံလောက်ပါ။ အနည်းဆုံး ${MIN_WITHDRAW.toLocaleString()} MMK ပြည့်မှ ထုတ်လို့ရပါမည်။`);
            } else {
                WebApp.showPopup({
                    title: 'ငွေထုတ်ယူခြင်း',
                    message: `${localBalance.toLocaleString()} MMK အားလုံးကို ထုတ်ယူရန် သေချာပါသလား?`,
                    buttons: [
                        { id: 'no', type: 'cancel', text: 'မထုတ်သေးပါ' },
                        { id: 'yes', type: 'default', text: 'ထုတ်မည်' }
                    ]
                }, (buttonId) => {
                    if (buttonId === 'yes') {
                        // Bot ဆီကို စာပို့ခြင်း
                        WebApp.sendData(`${localBalance.toLocaleString()} MMK ထုတ်မည်`);
                        
                        // ပို့ပြီးရင် ဖုန်းထဲက Balance ကို ၀ ပြန်လုပ်မလား (သို့) ဒီအတိုင်းထားမလား စဉ်းစားနိုင်ပါတယ်
                        // localBalance = 0;
                        // localStorage.setItem('my_coin_balance', localBalance);
                        // displayBalance();

                        WebApp.close(); // စာပို့ပြီးရင် Mini App ပိတ်သွားမယ်
                    }
                });
            }
        }
    </script>
</body>
</html>
