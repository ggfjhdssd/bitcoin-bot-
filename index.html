<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { background: #0088cc; color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        #status { margin-top: 20px; color: #666; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #0088cc;">AdsGram Reward ✨</h2>
        <p>၅၀၀ ကျပ် ရရှိရန် ကြော်ငြာကို အဆုံးထိကြည့်ပေးပါ</p>
        <button id="watchAdBtn">💸 ကြော်ငြာကြည့်မယ် 💸</button>
        <p id="status">ခလုတ်ကို နှိပ်ပါ</p>
    </div>

    <script>
        const webapp = window.Telegram.WebApp;
        webapp.ready();
        webapp.expand();
        const userId = webapp.initDataUnsafe.user.id;

        // သင်ပေးထားသော Block ID
        const AdController = window.Adsgram.init({ blockId: "int-23471" });

        document.getElementById('watchAdBtn').onclick = () => {
            const statusBox = document.getElementById('status');
            statusBox.innerText = "ကြော်ငြာကို ရှာဖွေနေပါသည်...";

            AdController.show().then((result) => {
                statusBox.innerText = "✅ အောင်မြင်သည်။ ပိုက်ဆံပေါင်းထည့်နေပါသည်...";
                statusBox.style.color = "green";

                // ပိုက်ဆံပေါင်းရန် Server ဆီသို့ လှမ်းပို့ခြင်း
                fetch(`https://bitcoin-bot-2zmf.onrender.com/reward-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                })
                .then(res => res.json())
                .then(data => {
                    webapp.showAlert(data.message);
                    webapp.close();
                })
                .catch(err => {
                    webapp.showAlert("Server Error! ခဏနေမှ ထပ်ကြိုးစားပါ။");
                });

            }).catch((result) => {
                console.error("Ad Error:", result);
                statusBox.innerText = "❌ ကြော်ငြာကြည့်ရှုမှု မအောင်မြင်ပါ";
                statusBox.style.color = "red";
                webapp.showAlert("ကြော်ငြာကို အဆုံးထိကြည့်မှသာ Reward ရရှိမည်ဖြစ်သည်။");
            });
        };
    </script>
</body>
</html>
